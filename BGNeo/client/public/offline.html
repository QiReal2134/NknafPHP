<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线 - Nknaf's Blog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1E1E2E;
      color: #CDD6F4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .offline-container {
      text-align: center;
      padding: 40px;
      max-width: 400px;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(137,180,250,.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .offline-icon svg { width: 40px; height: 40px; stroke: #89B4FA; }
    h1 { font-size: 1.4rem; margin-bottom: 10px; color: #CDD6F4; }
    p { color: #A6ADC8; line-height: 1.6; margin-bottom: 20px; }
    button {
      padding: 12px 28px;
      background: #89B4FA;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      cursor: pointer;
      transition: opacity .2s;
    }
    button:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0119 12.9V19a2 2 0 01-2 2H7a2 2 0 01-2-2v-7c0-1.86.5-3.61 1.39-5.11"/>
        <path d="M22 4L12 14"/><circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <h1>您当前处于离线状态</h1>
    <p>请检查您的网络连接后重试</p>
    <button onclick="window.location.reload()">重新加载</button>
  </div>
</body>
</html>
